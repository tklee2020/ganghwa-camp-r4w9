<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강화 베이비 캠프</title>
<meta name="description" content="마니산 베이비즈 1박 2일 — 강화도 페밀리하우스 (2026.10.10–10.11) 일정·장소·장보기·놀거리·정산">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" id="themeColor" content="#DCEFF4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="강화 캠프">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 글꼴: Pretendard 하나 (저장소에 파일로 — 오프라인에서도 같은 글꼴, 서비스워커가 저장) · SIL OFL 1.1 (fonts/LICENSE-Pretendard.txt) */
@font-face{font-family:'Pretendard';src:url('fonts/PretendardVariable.woff2') format('woff2');font-weight:45 920;font-style:normal;font-display:swap}

/* 화면: 파스텔 메시(화면에 고정) 위에 유리 타일 벤토. 글자는 유리 위가 아니라 타일 안의 불투명 카드 위에.
   포인트 색은 바다색 하나. 의미 표시(확인 필요 노랑 · 비상 반전 카드 · 가족 색)는 예외.
   위: 배지·🚑·🌗 줄 + (오늘 탭이 아닐 때) 지금/다음 한 줄 → 화면별 큰 제목 → 타일들 → 아래 고정 유리 메뉴 */
:root{
  color-scheme:light;
  --bg:#EEF6F5;
  /* 메시 4색: 하늘 · 민트 · 연노랑 · 살구 (RGB — 투명 끝점을 같은 색으로) */
  --m1:191,227,245; --m2:201,238,221; --m3:255,241,191; --m4:255,217,199;
  --glass:rgba(255,255,255,.55); --glass-fb:rgba(255,255,255,.86); --nav-glass:rgba(255,255,255,.72);
  --glass-line:rgba(255,255,255,.85);
  --glass-sh:0 10px 28px rgba(28,70,86,.10),0 1px 2px rgba(28,70,86,.06);
  --solid:#FFFFFF;
  --card:#FFFFFF; --card-line:rgba(16,36,43,0);
  --ink:#10242B; --ink-2:#3E525B; --ink-3:#5A6C74;
  --line:#DCE5E8; --chip:#EDF2F4; --chip-ink:#34474F;
  --sea:#0E7C86; --sea-ink:#0E7C86; --on-sea:#FFFFFF; --sea-tint:rgba(14,124,134,.10); --sea-track:#DCEBEC;
  --inv:#10242B; --inv-ink:#FFFFFF; --inv-ink-2:#CAD7DC; --inv-line:rgba(255,255,255,.75); --inv-btn:#FFFFFF; --inv-btn-ink:#10242B;
  --head-ink:#10242B; --head-sub:#34474F;
  --btn-sh:0 2px 10px rgba(28,70,86,.12);
  --f1:#FFD9C7; --f2:#BFE3F5; --f3:#C9EEDD; --f-ink:#10242B;
  --warn-bg:#FFF1BF; --warn-ink:#10242B;
  --f-body:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --gutter:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1722;
    --m1:22,60,108; --m2:12,100,106; --m3:42,52,124; --m4:10,82,90;
    --glass:rgba(20,28,36,.55); --glass-fb:rgba(20,28,36,.9); --nav-glass:rgba(20,28,36,.74);
    --glass-line:rgba(255,255,255,.14);
    --glass-sh:0 10px 28px rgba(0,0,0,.35);
    --solid:#121B23;
    --card:#1A2630; --card-line:rgba(255,255,255,.06);
    --ink:#EAF1F4; --ink-2:#B9C7CD; --ink-3:#9DAEB5;
    --line:#33434E; --chip:#24323C; --chip-ink:#CFDBE0;
    --sea:#0E7C86; --sea-ink:#6CCFD7; --on-sea:#FFFFFF; --sea-tint:rgba(108,207,215,.13); --sea-track:#24323C;
    --inv:#EAF2F4; --inv-ink:#10242B; --inv-ink-2:#34474F; --inv-line:rgba(16,36,43,.75); --inv-btn:#10242B; --inv-btn-ink:#FFFFFF;
    --head-ink:#F1F6F8; --head-sub:#C3D0D6;
    --btn-sh:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1722;
  --m1:22,60,108; --m2:12,100,106; --m3:42,52,124; --m4:10,82,90;
  --glass:rgba(20,28,36,.55); --glass-fb:rgba(20,28,36,.9); --nav-glass:rgba(20,28,36,.74);
  --glass-line:rgba(255,255,255,.14);
  --glass-sh:0 10px 28px rgba(0,0,0,.35);
  --solid:#121B23;
  --card:#1A2630; --card-line:rgba(255,255,255,.06);
  --ink:#EAF1F4; --ink-2:#B9C7CD; --ink-3:#9DAEB5;
  --line:#33434E; --chip:#24323C; --chip-ink:#CFDBE0;
  --sea:#0E7C86; --sea-ink:#6CCFD7; --on-sea:#FFFFFF; --sea-tint:rgba(108,207,215,.13); --sea-track:#24323C;
  --inv:#EAF2F4; --inv-ink:#10242B; --inv-ink-2:#34474F; --inv-line:rgba(16,36,43,.75); --inv-btn:#10242B; --inv-btn-ink:#FFFFFF;
  --head-ink:#F1F6F8; --head-sub:#C3D0D6;
  --btn-sh:0 2px 10px rgba(0,0,0,.35);
}

/* ---------- 바탕 ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(95% 60% at 0% 0%, rgba(var(--m1),1) 0%, rgba(var(--m1),0) 78%),
    radial-gradient(90% 55% at 100% 28%, rgba(var(--m2),1) 0%, rgba(var(--m2),0) 78%),
    radial-gradient(100% 60% at 0% 68%, rgba(var(--m3),1) 0%, rgba(var(--m3),0) 78%),
    radial-gradient(95% 60% at 100% 100%, rgba(var(--m4),1) 0%, rgba(var(--m4),0) 78%),
    var(--bg)}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
b,strong{font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea-ink);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gutter) calc(112px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* ---------- 위 줄 (메시 위, 유리 아님) ---------- */
.top{padding:2px 2px 0}
.top__row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{display:inline-flex;align-items:center;min-height:36px;padding:4px 14px;border-radius:999px;background:var(--card);color:var(--ink);font-size:15px;font-weight:800;letter-spacing:-.01em;box-shadow:var(--btn-sh);white-space:nowrap;font-variant-numeric:tabular-nums}
.top__btns{display:flex;gap:8px;flex-shrink:0}
.ibtn{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;line-height:1;border:0;padding:0;background:var(--card);color:var(--ink);box-shadow:var(--btn-sh);cursor:pointer}
.ibtn--sos{background:var(--inv)}
.ticker{display:flex;align-items:flex-start;gap:10px;width:100%;margin-top:12px;padding:11px 14px;border:0;border-radius:18px;background:var(--card);box-shadow:var(--btn-sh);text-align:left;font-size:15px;line-height:1.45;cursor:pointer}
.ticker .dot{margin-top:7px}
.ticker b{color:var(--sea-ink);font-weight:800}
.tk-sub{display:block;color:var(--ink-2);font-size:14px}
body[data-view="plan"] .ticker{display:none}

/* ---------- 화면 제목 ---------- */
.view{padding-top:18px}
.vhead{padding:0 2px 18px}
.title{font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-.03em;color:var(--head-ink);text-wrap:balance}
h2.title{font-size:30px}
.title em,.em{font-style:normal;color:var(--sea-ink)}
.sub{margin-top:6px;font-size:16px;font-weight:600;color:var(--head-sub);line-height:1.45}
.sub b{color:var(--head-ink)}

/* ---------- 벤토 + 유리 타일 ---------- */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.tile{min-width:0;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:24px;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);
  border:2px solid var(--glass-line);box-shadow:var(--glass-sh)}
.span2{grid-column:1 / -1}
.th{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:3px 12px 3px 11px;border-radius:999px;background:var(--card);color:var(--ink);font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--card-line);font-variant-numeric:tabular-nums}
.pill--btn{border:0;min-height:36px;cursor:pointer;color:var(--sea-ink)}
.pill--ex{box-shadow:inset 0 0 0 2px var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.dot.live{background:var(--sea);box-shadow:0 0 0 4px var(--sea-tint)}
.card{min-width:0;background:var(--card);border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px var(--card-line)}
.half .card{display:flex;flex-direction:column;padding:12px 11px}
.half .card:last-child{flex:1 1 auto}
.push{margin-top:auto}
.card h3{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.k{font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.45}
.big{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:14px}
ul.dots{list-style:none;margin:8px 0 0;padding:0}
ul.dots li{position:relative;padding-left:14px}
ul.dots li+li{margin-top:5px}
ul.dots li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.note{margin-top:10px;padding:9px 11px;border-radius:12px;background:var(--chip);font-size:15px;line-height:1.5}

/* 확인 필요 — 연노랑 + 점선 먹색 테두리 (의미 색, 두 테마 같음) */
.qbadge{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 8px 0 3px;border-radius:999px;background:var(--warn-bg);color:var(--warn-ink);border:1.5px dashed var(--warn-ink);font-size:13px;font-weight:800;line-height:1.4;vertical-align:1px;white-space:nowrap}
.qbadge::before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--warn-ink);color:var(--warn-bg);font-size:12px;font-weight:900;line-height:1}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 14px;border-radius:14px;border:0;font-size:16px;font-weight:800;line-height:1.25;text-align:center;text-decoration:none;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn--pri{background:var(--sea);color:var(--on-sea)}
.btn--sec{background:var(--chip);color:var(--ink)}
.btn--sm{min-height:44px;padding:8px 12px;font-size:15px;border-radius:12px}
.btn--full{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn--pri{flex:1.6 1 0;min-height:54px;font-size:17px}
.acts .btn--sec{flex:1 1 0;min-height:54px}
.acts--sm{margin-top:10px}
.acts--sm .btn--pri,.acts--sm .btn--sec{min-height:44px;font-size:15px}
.maplinks{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin-top:2px;font-size:14px;color:var(--ink-2)}
.maplinks a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.maplinks a:first-child{padding-left:2px}

/* 태그 */
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tag{display:inline-flex;align-items:center;min-height:26px;padding:1px 10px;border-radius:999px;font-size:14px;font-weight:800;line-height:1.3;white-space:nowrap}
.tag.now{background:var(--sea);color:var(--on-sea)}
.tag.next{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.time{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.eta{font-size:14px;font-weight:700;color:var(--ink-2)}
.cat{display:inline-block;padding:0 7px;margin-right:6px;border-radius:7px;background:var(--chip);color:var(--chip-ink);font-size:13px;font-weight:700;line-height:1.6;vertical-align:1px;white-space:nowrap}
.meta .cat{margin-right:0}

/* ---------- 지금 / 다음 ---------- */
.now-title{margin-top:10px;font-size:27px;line-height:1.22;font-weight:800;letter-spacing:-.03em}
.pts{list-style:none;margin:10px 0 0;padding:0}
.pts li{position:relative;padding-left:14px;margin-top:6px}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.next h3{margin-top:8px;font-size:21px}
.next .k{margin-top:2px}
.alt{margin-top:10px;padding:9px 11px;border-radius:12px;background:var(--chip);font-size:15px;line-height:1.5}
.alt b{color:var(--sea-ink)}

/* ---------- 일정 타임라인 ---------- */
.days{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--chip)}
.days button{min-height:52px;border:0;border-radius:11px;background:none;color:var(--ink-2);cursor:pointer;line-height:1.2;padding:6px}
.days button b{display:block;font-size:16px;color:inherit;font-variant-numeric:tabular-nums}
.days button small{display:block;font-size:13px;font-weight:600;margin-top:2px}
.days button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--btn-sh)}
.days button[aria-pressed="true"] b{color:var(--sea-ink)}
.day-t{margin:12px 2px 6px}
.tl{list-style:none;margin:0;padding:0}
.card--tl{padding:12px 10px}
.ev{display:grid;grid-template-columns:54px 18px minmax(0,1fr);column-gap:6px;padding:9px 4px;border-radius:12px}
.tm{white-space:nowrap;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.45;letter-spacing:-.01em}
.tm small{display:block;font-size:13px;font-weight:600;color:var(--ink-3);line-height:1.3}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:8px;top:-9px;bottom:-9px;width:2px;background:var(--line)}
.ev:first-child .rail::before{top:12px}
.ev:last-child .rail::before{bottom:auto;height:21px}
.rail i{position:absolute;left:2px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--ink-3)}
.is-past .rail i{background:var(--ink-3);box-shadow:none}
.is-past .rail i::after{content:"";position:absolute;left:5px;top:2.5px;width:3px;height:6px;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(45deg)}
.is-now .rail i{left:0;top:3px;width:18px;height:18px;background:var(--sea);box-shadow:0 0 0 4px var(--sea-tint)}
.ev__c{min-width:0}
.ev__h{position:relative;display:block;padding-right:26px;border-radius:8px}
.ev__h[role="button"]{cursor:pointer}
.ev-t{font-size:16px;font-weight:700;line-height:1.45;letter-spacing:-.01em}
.ev-m{margin-top:2px;font-size:15px;color:var(--ink-2);line-height:1.5}
/* 접힌 상태에서는 첫 메모를 한 줄만 — 눌러 펼치면 전부 */
.ev:not(.is-open) .ev-m{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chev{position:absolute;right:4px;top:6px;width:10px;height:10px;border:solid var(--ink-3);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}
.is-open .chev{transform:rotate(-135deg);top:11px}
.ev__x{display:none}
.is-open .ev__x{display:block}
.ev-ml{list-style:none;margin:4px 0 0;padding:0;font-size:15px;color:var(--ink-2);line-height:1.5}
.ev-ml li{position:relative;padding-left:12px;margin-top:4px}
.ev-ml li::before{content:"";position:absolute;left:1px;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.is-past .tm,.is-past .ev-t{color:var(--ink-3)}
.is-past .ev-t{font-weight:600}
.ev.is-now{background:var(--sea-tint)}
.ev.is-now .ev-t{font-size:17px;font-weight:800}
.ev .tag.now{min-height:22px;padding:0 8px;font-size:13px;vertical-align:2px}
.tmr p{font-size:16px;line-height:1.55}
.tmr .lbl{font-weight:800}

/* ---------- 숙소 ---------- */
.addr{margin-top:6px;font-size:16px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{padding:9px 11px;border-radius:12px;background:var(--chip);min-width:0}
.stat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.info{margin-top:10px;font-size:15px;color:var(--ink-2);font-weight:600}

/* ---------- 날씨 · 정산 (반쪽 타일) ---------- */
.wx-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.wx-ic{font-size:28px;line-height:1}
.wx-d{font-size:16px;font-weight:800}
.wx-t{margin-top:6px;line-height:1.2}
.wx-t .big{font-size:30px}
.wx-lo{display:block;margin-top:2px;font-size:15px;font-weight:600;color:var(--ink-2)}
.wx-s{margin-top:8px}
.wx-mid{margin-top:4px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.lead{margin-top:4px;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.memo{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px;font-weight:700;line-height:1.45}
.fine{padding-top:10px;font-size:13px;color:var(--ink-3);font-weight:600}
.sum-big{margin-top:2px;font-size:23px}
.xf{padding:9px 0 7px;border-top:1px solid var(--line)}
.xf:first-of-type{border-top:0;padding-top:4px}
.xf .who-l{font-size:14px;font-weight:700;line-height:1.7}
.xf .amt{display:block;font-size:19px}
.fam{display:inline-block;padding:0 6px;border-radius:7px;background:var(--fc,var(--chip));color:var(--f-ink);font-weight:800;white-space:nowrap}
.half .btn{padding:10px 6px}
/* 반쪽 타일 카드 맨 아래 버튼·글: 앞에 늘어나는 간격(최소 12px)을 둬서 바닥에 붙인다 */
.sp{flex:1 0 12px}

/* ---------- 체크 ---------- */
.ck__bar{height:10px;border-radius:99px;background:var(--sea-track);overflow:hidden;margin:10px 0 4px}
.ck__bar i{display:block;height:100%;width:0;background:var(--sea);border-radius:99px;transition:width .2s}
.ck__sub{font-size:14px;font-weight:600;color:var(--ink-2)}
.ck__note{margin-top:8px;padding:9px 11px;border-radius:12px;background:var(--chip);font-size:15px}
.ck__g h4{margin:12px 0 0;font-size:14px;font-weight:800;color:var(--ink-2)}
.ck__i{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 2px;cursor:pointer;border-top:1px solid var(--line)}
.ck__g h4 + .ck__i,.ck__g .ck__i:first-child{border-top:0}
.ck__i input{position:absolute;opacity:0;width:1px;height:1px;margin:0;left:0;top:50%}
.ck__box{flex:none;position:relative;width:26px;height:26px;border-radius:8px;background:var(--card);box-shadow:inset 0 0 0 2px var(--ink-3)}
.ck__i input:checked + .ck__box{background:var(--sea);box-shadow:none}
.ck__i input:checked + .ck__box::after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;border:solid var(--on-sea);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck__i input:focus-visible + .ck__box{outline:3px solid var(--sea-ink);outline-offset:2px}
.ck__t{font-size:16px;font-weight:600;line-height:1.45;min-width:0}
.ck__i input:checked ~ .ck__t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.ck__f{display:flex;justify-content:flex-end;margin-top:6px}
.more{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;width:100%;margin-top:8px;padding:0 14px;border:0;border-radius:12px;background:var(--chip);color:var(--ink);font-weight:800;text-decoration:none;cursor:pointer;text-align:left}
.more span{font-size:14px;color:var(--ink-2);font-weight:600}
.alldone{padding:10px 2px;font-weight:700;color:var(--sea-ink)}

/* ---------- 비상 — 반전 카드(낮엔 먹색, 밤엔 흰색) ---------- */
#sos{scroll-margin-top:16px}
.sos .pill{background:var(--inv);color:var(--inv-ink)}
.sos .dot{background:var(--inv-ink)}
.card.inv{background:var(--inv);color:var(--inv-ink);padding:16px}
.inv h2{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.b119{display:flex;width:100%;min-height:70px;margin-top:12px;border-radius:16px;background:var(--inv-btn);color:var(--inv-btn-ink);font-size:34px;font-weight:800;letter-spacing:-.02em}
.b119 svg{width:28px;height:28px}
.hosp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hbtn{flex-direction:column;gap:1px;min-height:66px;padding:8px 6px;background:transparent;color:var(--inv-ink);box-shadow:inset 0 0 0 2px var(--inv-line)}
.hbtn b{font-size:15px;font-weight:800}
.hbtn span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.inv ul.dots{margin-top:12px}
.inv ul.dots li{font-size:16px;line-height:1.5}
.inv ul.dots li+li{margin-top:8px}
.inv ul.dots li::before{background:var(--inv-ink-2)}
.inv .qbadge{border-color:var(--warn-ink)}
.lnks{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:6px}
.lnk{display:inline-flex;align-items:center;min-height:44px;font-size:16px;font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* ---------- 세 가족 · 놀거리 (작게) ---------- */
.fm + .fm{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.fm .fam{font-size:15px;padding:1px 8px;border-radius:8px}
.fm p{margin-top:3px;font-size:16px;font-weight:600}
.play-t{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.play-k{margin:6px 0 12px;font-size:15px}
.ver{margin-top:22px;text-align:center;font-size:13px;font-weight:600;color:var(--head-sub)}

/* ---------- 장소 ---------- */
.pl{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.pl__c h3{font-size:19px}
.pl__c h3 .tag{margin-left:6px;vertical-align:2px;background:var(--chip);color:var(--chip-ink);min-height:24px;font-size:13px}
.pl__c h3 .tag--b{box-shadow:inset 0 0 0 2px var(--ink);background:none;color:var(--ink)}
.pl__meta{margin-top:6px;display:grid;gap:3px;font-size:15px}
.pl__meta div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px}
.pl__note{margin-top:8px;font-size:15px;color:var(--ink-2)}
.facts{font-size:15px}
.qlist li{font-size:15px}
.foot{margin:22px 0 4px;font-size:13px;color:var(--head-sub);text-align:center;font-weight:600;line-height:1.6}

/* ---------- 놀거리 ---------- */
.game p{font-size:16px}
.game p + p,.game p + ul{margin-top:8px}
.draw{margin-top:12px;padding:14px;border-radius:14px;background:var(--chip);border:2px dashed var(--line);text-align:center;min-height:72px;display:grid;place-items:center;font-size:19px;font-weight:700;line-height:1.4}
.draw b{font-weight:800}
.draw .small{font-weight:600;color:var(--ink-2)}
.draw.on{border-style:solid;border-color:var(--sea);background:var(--sea-tint)}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.names button,.chipsel button{min-height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);font-size:15px;font-weight:800;cursor:pointer}
.names button[aria-pressed="true"],.chipsel button[aria-pressed="true"]{background:var(--sea);color:var(--on-sea)}
.names button.done{opacity:.45}
.chipsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.teams div{border-radius:12px;padding:10px;background:var(--chip);font-size:15px;text-align:center}
.teams b{display:block;font-size:17px}
.idea{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.idea:first-child{border-top:0;padding-top:2px}
.idea i{font-style:normal;font-size:24px;line-height:1.2}
.idea b{display:block}
.idea span{display:block;font-size:15px;color:var(--ink-2)}

/* ---------- 정산 ---------- */
.form{display:grid;gap:10px;margin-top:10px}
.field{width:100%;min-height:52px;padding:0 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:16px}
.field:focus{border-color:var(--sea);outline:none}
.famsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.famsel button{min-height:48px;border-radius:14px;border:0;background:var(--chip);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}
.famsel button[aria-pressed="true"]{background:var(--fc);color:var(--f-ink);box-shadow:inset 0 0 0 2px var(--f-ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{min-height:40px;padding:0 12px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer}
.ledger{list-style:none;margin:6px 0 0;padding:0}
.ledger li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;min-height:52px;padding:6px 0;border-top:1px solid var(--line);font-size:16px}
.ledger li:first-child{border-top:0}
.amt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.del{width:40px;height:40px;border-radius:12px;border:0;background:var(--chip);color:var(--ink-2);cursor:pointer;font-weight:800}
.empty{color:var(--ink-2);font-size:15px;padding:6px 0}
.sum{display:grid;gap:6px;margin-top:8px;font-size:16px}
.sum .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sum .row b{font-variant-numeric:tabular-nums}
.xfer{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--sea-tint);font-size:17px;font-weight:700;line-height:1.7}
.xfer b{font-size:19px;font-variant-numeric:tabular-nums}

/* ---------- 아래 고정 메뉴 (유리) ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock__in{pointer-events:auto;max-width:536px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:24px;background:var(--nav-glass);
  -webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);
  border:2px solid var(--glass-line);box-shadow:0 8px 30px rgba(16,36,43,.18)}
.dock button{position:relative;flex:1 1 0;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:18px;background:none;color:var(--ink-2);font-size:13px;font-weight:700;line-height:1.2;cursor:pointer}
.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock button[aria-current="page"]{background:var(--card);color:var(--sea-ink);font-weight:800}
.dock__n{position:absolute;top:3px;left:50%;margin-left:6px;min-width:24px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:var(--card);font-size:13px;font-weight:800;line-height:20px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;max-width:calc(100% - 32px);padding:11px 18px;border-radius:14px;background:var(--inv);color:var(--inv-ink);font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 접근성 · 대체 ---------- */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .tile{background:var(--glass-fb)}
  .dock__in{background:var(--solid)}
}
@media (prefers-reduced-transparency: reduce){
  .tile,.dock__in{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  .card,.pill{box-shadow:inset 0 0 0 1px var(--line)}
  .card.inv{box-shadow:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:339px){.bento{grid-template-columns:minmax(0,1fr)}}
@media (min-width:600px){.title{font-size:38px}}
@media print{.top,.dock,.toast,.acts,.maplinks{display:none!important}.wrap{padding-bottom:0}}

}

  var more = memo.length > 1 || !!it.alt || !!p, open = more && (allOpen || !!openSet[it._id]);

    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset&hourly=temperature_2m&timezone=Asia%2FSeoul&start_date=' + TRIP.start + '&end_date=' + TRIP.end;
  fetch(u).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ if (j && j.daily){ j._t = Date.now(); save('wx', j); renderWx(); } }).catch(function(){});
}

function settle(L){
  var F = TRIP.families, paid = {}, total = 0;
  F.forEach(function(f){ paid[f.id] = 0; });
  L.forEach(function(e){ paid[e.fam] = (paid[e.fam] || 0) + e.amt; total += e.amt; });
  var share = total / F.length;
  var bal = F.map(function(f){ return { id: f.id, v: paid[f.id] - share }; });
  var debt = bal.filter(function(b){ return b.v < -0.5; }).sort(function(a, b){ return a.v - b.v; });
  var cred = bal.filter(function(b){ return b.v > 0.5; }).sort(function(a, b){ return b.v - a.v; });
  var x = [], i = 0, j = 0;
  while (i < debt.length && j < cred.length){
    var m = Math.min(-debt[i].v, cred[j].v);
    x.push({ from: debt[i].id, to: cred[j].id, amt: Math.round(m / 10) * 10 });
    debt[i].v += m; cred[j].v -= m;
    if (debt[i].v > -0.5) i++;
    if (cred[j].v < 0.5) j++;
  }
  return { total: total, share: share, paid: paid, x: x.filter(function(t){ return t.amt > 0; }) };
}

}

function syncThemeColor(){
  var a = document.documentElement.getAttribute('data-theme');
  var dark = a === 'dark' || (a !== 'light' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
  $('#themeColor').setAttribute('content', dark ? '#0E1E2B' : '#DCEFF4');
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target : e.target.parentNode, b;
  if ((b = t.closest('#dock button'))) { show(b.getAttribute('data-view')); return; }
  if ((b = t.closest('[data-go]'))) { var g = b.getAttribute('data-go'); if (g === 'now') goNow(); else if (g === 'sos') goSOS(); else show(g); return; }
  if ((b = t.closest('[data-ev]'))) { toggleEv(b); return; }
  if ((b = t.closest('#tlAll'))) { allOpen = !allOpen; openSet = {}; renderTL(); return; }
  if ((b = t.closest('[data-day]'))) {
    var fromBelow = !!b.closest('#tmr') || !!b.closest('#hero');
    curDay = +b.getAttribute('data-day'); renderDays(); renderTL();
    if (fromBelow) $('#tlTile').scrollIntoView({ block: 'start', behavior: 'smooth' });
    return;
  }
  if ((b = t.closest('#themeBtn'))) {
    /* 누를 때마다 지금 보이는 것의 반대로 바뀐다. 폰 설정과 같은 쪽으로 돌아오면 '폰 따라가기'로 저장 (예전엔 폰이 밝을 때 첫 누름이 "밝게"라 화면이 그대로였음) */
    var sysDark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches), cur = load('theme', 'system');
    var eff = cur === 'light' || cur === 'dark' ? cur : (sysDark ? 'dark' : 'light'), nx = eff === 'dark' ? 'light' : 'dark', follow = nx === (sysDark ? 'dark' : 'light');
    save('theme', follow ? 'system' : nx);
    if (follow) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', nx);
    syncThemeColor();
    toast((nx === 'light' ? '테마: 밝게' : '테마: 어둡게') + (follow ? ' (폰 설정 따라가기)' : '')); return;
  }
  if ((b = t.closest('[data-ckreset]'))) {
    var sec = b.closest('.ck'), done = load('shop', {});
    if (!confirm('이 목록의 체크를 모두 지울까요?')) return;
    $$('input[data-ck]', sec).forEach(function(i){ delete done[i.getAttribute('data-ck')]; i.checked = false; });
    save('shop', done); refreshList(sec); renderShopTile(); updateShopBadge(); renderTicker(); return;
  }
  if ((b = t.closest('[data-mis]'))) {
    var name = b.getAttribute('data-mis'), ppl = people(), M = shuffle(TRIP.games.missions, seeded('ghcamp26-mission'));
    var o = $('#misOut');
    if (b.getAttribute('aria-pressed') === 'true') { b.setAttribute('aria-pressed', 'false'); b.classList.add('done'); o.className = 'draw'; o.textContent = '가렸어요. 다음 사람!'; return; }
    $$('#misNames button').forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
    b.setAttribute('aria-pressed', 'true');
    o.className = 'draw on'; o.innerHTML = '🕵️ ' + esc(name) + '의 미션<br><b>' + esc(M[ppl.indexOf(name) % M.length]) + '</b><br><span class="small">외웠으면 이름을 한 번 더 눌러 가리기</span>'; return;
  }
  if ((b = t.closest('#telBtn'))) { var o2 = $('#telOut'); o2.className = 'draw on'; o2.textContent = '💞 ' + pick(TRIP.games.telepathy); return; }
  if ((b = t.closest('#penBtn'))) { var o3 = $('#penOut'); o3.className = 'draw on'; o3.textContent = pick(TRIP.games.penalties); return; }
  if ((b = t.closest('[data-cat]'))) { $$('#liarCats button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); }); return; }
  if ((b = t.closest('#liarStart'))) {
    var catB = $('#liarCats [aria-pressed="true"]'), cat = catB ? catB.getAttribute('data-cat') : Object.keys(TRIP.games.liar)[0];
    var order = shuffle(people());
    liar = { cat: cat, word: pick(TRIP.games.liar[cat]), liar: pick(order), order: order, i: 0, showing: false };
    $('#liarNext').hidden = false; $('#liarReveal').hidden = true; liarStep(); return;
  }
  if ((b = t.closest('#liarNext'))) { if (!liar) return; if (liar.showing){ liar.showing = false; liar.i++; } else liar.showing = true; liarStep(); return; }
  if ((b = t.closest('#liarReveal'))) { if (!liar) return; var o4 = $('#liarOut'); o4.className = 'draw on'; o4.innerHTML = '라이어는 <b>' + esc(liar.liar) + '</b>!<br>제시어: <b>' + esc(liar.word) + '</b>'; b.hidden = true; return; }
  if ((b = t.closest('#teamBtn'))) { teams(true); return; }
  if ((b = t.closest('#teamBtn2'))) { teams(false); return; }
  if ((b = t.closest('[data-payer]'))) { payer = b.getAttribute('data-payer'); $$('#payer button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); }); return; }
  if ((b = t.closest('[data-qw]'))) { $('#sWhat').value = b.getAttribute('data-qw'); var qa = +b.getAttribute('data-qa'); if (qa) $('#sAmt').value = qa.toLocaleString('ko-KR'); else $('#sAmt').focus(); return; }
  if ((b = t.closest('[data-del]'))) { var L = load('split', []), k = +b.getAttribute('data-del'); if (!L[k] || !confirm(L[k].what + ' ' + won(L[k].amt) + ' 지울까요?')) return; L.splice(k, 1); save('split', L); renderLedger(); return; }
  if ((b = t.closest('#copySettle'))) { copyText(settleText()); return; }
  if ((b = t.closest('#clearSplit'))) { if (confirm('정산 내역을 전부 지울까요? 되돌릴 수 없어요.')) { save('split', []); renderLedger(); } return; }
  if ((b = t.closest('#installBtn'))) { if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt = null; renderInfo(); }); } return; }
  if ((b = t.closest('#shareBtn'))) {
    var url = location.href.split('#')[0];
    if (navigator.share) navigator.share({ title: TRIP.title, text: TRIP.sub + ' — 일정·장보기·정산', url: url }).catch(function(){});
    else copyText(url);
    return;
  }
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.hasAttribute && e.target.hasAttribute('data-ev')) { e.preventDefault(); toggleEv(e.target); }
});
document.addEventListener('change', function(e){
  var i = e.target;
  if (i.hasAttribute('data-ck')){
    var id = i.getAttribute('data-ck'), d = load('shop', {});
    if (i.checked) d[id] = 1; else delete d[id];
    save('shop', d);
    /* 오늘 탭 미니 목록과 장보기 탭이 같은 항목을 보여 주므로 양쪽 체크를 맞춘다 */
    $$('input[data-ck]').forEach(function(x){ if (x.getAttribute('data-ck') === id) x.checked = i.checked; });
    $$('#shopLists .ck').forEach(refreshList); refreshMini(); updateShopBadge(); renderTicker();
    if (nowState().phase === 'before') renderHero();
  }
  if (i.hasAttribute('data-shot')){ var s = load('shots', {}); if (i.checked) s[i.getAttribute('data-shot')] = 1; else delete s[i.getAttribute('data-shot')]; save('shots', s); }
});
$('#sAmt').addEventListener('input', function(){ var n = this.value.replace(/[^0-9]/g, ''); this.value = n ? (+n).toLocaleString('ko-KR') : ''; });
$('#splitForm').addEventListener('submit', function(e){
  e.preventDefault();
  var what = $('#sWhat').value.trim(), amt = +$('#sAmt').value.replace(/[^0-9]/g, '');
  if (!amt){ toast('금액을 넣어 주세요'); $('#sAmt').focus(); return; }
  var L = load('split', []); L.push({ fam: payer, what: what || '기타', amt: amt, ts: Date.now() }); save('split', L);
  $('#sWhat').value = ''; $('#sAmt').value = ''; renderLedger(); toast(fam(payer).name + ' ' + won(amt) + ' 추가');
});
window.addEventListener('popstate', function(){ show(location.hash.slice(1), false); });
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; var b = $('#installBtn'); if (b) b.disabled = false; });
try { var mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', syncThemeColor); else if (mq.addListener) mq.addListener(syncThemeColor); } catch (e) {}

/* ---------- 시작 ---------- */
(function init(){
  renderTitle();
  var st = nowState();
  if (st.phase === 'during') curDay = st.cur._day;
  renderDays(); renderTL(); renderHero(); renderTicker();
  renderStayTile(); renderWx(); renderShopTile(); renderSOS(); renderCrew(); renderPlayTile();
  renderPlaces(); renderShop(); renderGames(); renderPhoto(); renderSplitForm(); renderLedger();
  $('#ver1').textContent = '🔖 앱 버전 ' + BUILD;
  syncThemeColor();
  var h = location.hash.slice(1);
  if (h === 'sos') goSOS(); else show(VIEWS.indexOf(h) >= 0 ? h : 'plan', false);
  fetchWx();
  var last = load('build', null);
  if (last && last !== BUILD) setTimeout(function(){ toast('새 버전이에요 · ' + BUILD); }, 600);
  save('build', BUILD);
  setInterval(function(){
    var before = nowState(); renderTicker(); renderHero(); renderWx();
    if (before.phase === 'during') renderTL();
    if (miniListId() !== miniId) renderShopTile();
  }, 60000);
  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
})();
</script>
</body>
